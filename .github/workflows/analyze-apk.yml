name: Trace Tango API Call Chains

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tango-api-call-chains
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 file ripgrep

      - name: Prepare folders
        run: mkdir -p work results package/source-context

      - name: Download original APK and record hash
        env:
          APK_URL: https://github.com/denarelys-lgtm/NexusAPK-Patcher/releases/download/Apk/tango-Tango_APK-android-9.62.9-20260609140828-production-assemblefullrelease-all.apk
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o work/tango-original.apk
          test -s work/tango-original.apk
          sha256sum work/tango-original.apk | tee results/apk-sha256.txt
          stat -c 'APK size bytes: %s' work/tango-original.apk | tee results/apk-size.txt
          unzip -tq work/tango-original.apk > results/apk-integrity.log

      - name: Download JADX CLI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/skylot/jadx/releases/latest",
              headers={"User-Agent": "NexusAPK-Patcher"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = [
              a["browser_download_url"] for a in release.get("assets", [])
              if a["name"].startswith("jadx-")
              and not a["name"].startswith("jadx-gui-")
              and a["name"].endswith(".zip")
          ]
          if not assets:
              raise SystemExit("No JADX CLI ZIP found in latest release")
          with open("work/jadx-url.txt", "w") as f:
              f.write(assets[0])
          print("Selected JADX release:", release.get("tag_name"))
          print("Selected asset:", assets[0])
          PY
          curl -fL --retry 3 "$(cat work/jadx-url.txt)" -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          JADX_BIN="$(find work/jadx -type f -name jadx -print -quit)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          "$JADX_BIN" --version
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

      - name: Decompile APK
        continue-on-error: true
        run: |
          set +e
          "$JADX_BIN" --threads-count 2 --show-bad-code \
            -d work/jadx-out work/tango-original.apk \
            > results/jadx.log 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > results/jadx-exit-code.txt
          find work/jadx-out -type f -name '*.java' | wc -l > results/java-file-count.txt
          echo "JADX exit code: $STATUS; Java files: $(cat results/java-file-count.txt)"

      - name: Build advanced cross-reference and call-chain reports
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          from collections import defaultdict

          root = Path("work/jadx-out")
          outdir = Path("results")
          source_ext = {".java", ".kt", ".xml", ".json", ".txt"}
          
          targets = {
              "UserBalanceResponse": re.compile(r"\bUserBalanceResponse\b"),
              "GiftBalanceResponse": re.compile(r"\bGiftBalanceResponse\b"),
              "PromotionCoinsClaimResponse": re.compile(r"\bPromotionCoinsClaimResponse\b"),
              "UserBalance": re.compile(r"\bUserBalance\b"),
              "GiftBalance": re.compile(r"\bGiftBalance\b"),
              "LiveCountryChooserActivity": re.compile(r"\bLiveCountryChooserActivity\b"),
              "LiveCountryPickerFragment": re.compile(r"\bLiveCountryPickerFragment\b"),
              "LiveViewerActivity": re.compile(r"\bLiveViewerActivity\b"),
              "LiveViewerFragment": re.compile(r"\bLiveViewerFragment\b"),
              "ChatActivity": re.compile(r"\bChatActivity\b"),
              "ChatRequestInboxActivity": re.compile(r"\bChatRequestInboxActivity\b"),
          }
          
          network = re.compile(
              r"@(?:GET|POST|PUT|PATCH|DELETE|HTTP|Headers)\b|"
              r"\b(?:baseUrl|newCall|enqueue|execute|Request\.Builder|"
              r"Retrofit|OkHttpClient|GraphQL|grpc|HttpUrl|"
              r"api/client/balance)\b|"
              r"""["']/(?:v[0-9]+/)?[A-Za-z0-9_./{}?=&-]{2,}["']""",
              re.I
          )
          
          feature_terms = re.compile(
              r"\b(?:balance|coins?|giftbalance|country|region|live|broadcast|"
              r"stream|chat|conversation|endpoint|request|response|repository|api)\b",
              re.I
          )

          files = []
          if root.exists():
              for p in root.rglob("*"):
                  if p.is_file() and p.suffix in source_ext:
                      try:
                          if p.stat().st_size <= 3_000_000:
                              files.append(p)
                      except OSError:
                          pass

          text_cache = {}
          for p in files:
              try:
                  text_cache[p] = p.read_text(encoding="utf-8", errors="replace").splitlines()
              except OSError:
                  text_cache[p] = []

          # 1. Cross reference index
          index_path = outdir / "cross-reference-index.txt"
          with index_path.open("w", encoding="utf-8") as o:
              o.write("CROSS-REFERENCE INDEX\n")
              o.write(f"Files scanned: {len(files)}\n")
              for name, pat in targets.items():
                  o.write("\n" + "=" * 70 + "\n" + name + "\n" + "=" * 70 + "\n")
                  hits = 0
                  for p, lines in text_cache.items():
                      nums = [i + 1 for i, line in enumerate(lines) if pat.search(line)]
                      if nums:
                          hits += len(nums)
                          o.write(f"{p} :: lines {','.join(map(str, nums[:100]))}\n")
                  o.write(f"Total matching lines: {hits}\n")

          # 2. Detailed excerpts
          details_path = outdir / "model-and-feature-usage.txt"
          with details_path.open("w", encoding="utf-8") as o:
              o.write("MODEL / FEATURE USAGE EXCERPTS\n")
              for name, pat in targets.items():
                  o.write("\n\n" + "#" * 78 + "\n" + name + "\n" + "#" * 78 + "\n")
                  matches = 0
                  for p, lines in text_cache.items():
                      for i, line in enumerate(lines):
                          if not pat.search(line):
                              continue
                          o.write(f"\nFILE: {p}\nMATCH LINE: {i+1}\n")
                          for j in range(max(0, i-12), min(len(lines), i+13)):
                              o.write(f"{'>>' if j == i else '  '} {j+1}: {lines[j][:400]}\n")
                          matches += 1
                          if matches >= 80:
                              break
                      if matches >= 80:
                          break
                  o.write(f"\nExcerpts emitted: {matches}\n")

          # 3. Network candidates & Retrofit interfaces detection
          net_path = outdir / "network-candidates.txt"
          with net_path.open("w", encoding="utf-8") as o:
              o.write("NETWORK DECLARATIONS / ROUTE CANDIDATES\n")
              count = 0
              for p, lines in text_cache.items():
                  joined = "\n".join(lines)
                  relevant = bool(feature_terms.search(joined))
                  is_retrofit_interface = "@GET" in joined or "@POST" in joined
                  for i, line in enumerate(lines):
                      if not network.search(line) and not is_retrofit_interface:
                          continue
                      if not relevant and count > 1200:
                          continue
                      o.write(f"\nFILE: {p}\nLINE: {i+1}\n")
                      for j in range(max(0, i-5), min(len(lines), i+6)):
                          o.write(f"{'>>' if j == i else '  '} {j+1}: {lines[j][:400]}\n")
                      count += 1
                      if count >= 2000:
                          o.write("\nGlobal candidate cap reached.\n")
                          break
                  if count >= 2000:
                      break
              o.write(f"\nCandidate locations emitted: {count}\n")

          # 4. Likely callers & Retrofit services shortlist
          shortlist = outdir / "likely-callers.txt"
          with shortlist.open("w", encoding="utf-8") as o:
              o.write("LIKELY CALLER / API / RETROFIT FILES\n")
              ranked = []
              for p, lines in text_cache.items():
                  joined = "\n".join(lines)
                  target_count = sum(bool(pat.search(joined)) for pat in targets.values())
                  net_count = sum(1 for line in lines if network.search(line))
                  is_api = 10 if ("@GET" in joined or "@POST" in joined) else 0
                  score = target_count * 5 + min(net_count, 30) * 2 + is_api
                  if score > 0:
                      ranked.append((score, net_count, target_count, p))
              for score, net_count, target_count, p in sorted(ranked, reverse=True)[:300]:
                  o.write(f"score={score} network_lines={net_count} target_symbols={target_count} file={p}\n")

          print("Analysis completed successfully.")
          PY

      - name: Assemble compact package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p package/source-context
          cp results/*.txt package/ 2>/dev/null || true
          cp results/*.log package/ 2>/dev/null || true

          # 1. Copiar clases clave conocidas y modelos
          find work/jadx-out -type f \
            \( -name '*UserBalanceResponse*' \
            -o -name '*GiftBalanceResponse*' \
            -o -name '*PromotionCoinsClaimResponse*' \
            -o -path '*/HY0/c.java' \
            -o -path '*/p3902ts/b.java' \
            -o -path '*/p1887e10/f.java' \
            -o -name '*LiveCountryChooserActivity*' \
            -o -name '*LiveCountryPickerFragment*' \
            -o -name '*LiveViewerActivity*' \
            -o -name '*LiveViewerFragment*' \
            -o -name '*ChatActivity*' \
            -o -name '*ChatRequestInbox*' \) \
            -size -2M \
            -exec cp --parents {} package/source-context/ \; \
            2>/dev/null || true

          # 2. Copiar automáticamente archivos que contengan anotaciones Retrofit (@GET / @POST) relacionadas con balance/stream/chat
          python3 - <<'PY'
          import shutil
          from pathlib import Path

          root = Path("work/jadx-out")
          dest = Path("package/source-context")
          
          if root.exists():
              for p in root.rglob("*.java"):
                  try:
                      text = p.read_text(encoding="utf-8", errors="replace")
                      if ("@GET" in text or "@POST" in text) and any(k in text.lower() for k in ["balance", "gift", "coin", "savings", "live", "chat"]):
                          rel = p.relative_to(root)
                          target_path = dest / rel
                          target_path.parent.mkdir(parents=True, exist_ok=True)
                          shutil.copy2(p, target_path)
                  except Exception:
                      pass
          PY

          {
            echo "Completed UTC: $(date -u +%FT%TZ)"
            echo "APK hash: $(awk '{print $1}' results/apk-sha256.txt 2>/dev/null || true)"
            echo "JADX exit code: $(cat results/jadx-exit-code.txt 2>/dev/null || echo unavailable)"
            echo "Java files: $(cat results/java-file-count.txt 2>/dev/null || echo 0)"
            echo "Package size:"
            du -sh package
          } > package/run-summary.txt

          find package -type f -name '*.log' -size +5M -exec truncate -s 5M {} \;
          find package -type f | sort | head -300
          du -sh package

      - name: Upload call-chain trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tango-api-call-chains
          path: package/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
