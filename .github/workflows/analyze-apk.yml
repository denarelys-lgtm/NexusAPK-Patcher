name: Trace Tango References

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tango-reference-trace
  cancel-in-progress: false

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip python3 file

      - name: Prepare folders
        run: mkdir -p work results package

      - name: Download original APK
        env:
          APK_URL: https://github.com/denarelys-lgtm/NexusAPK-Patcher/releases/download/Apk/tango-Tango_APK-android-9.62.9-20260609140828-production-assemblefullrelease-all.apk
        run: |
          set -euo pipefail
          curl -fL --retry 3 --retry-delay 2 "$APK_URL" -o work/tango-original.apk
          test -s work/tango-original.apk
          sha256sum work/tango-original.apk | tee results/apk-sha256.txt
          stat -c 'APK size bytes: %s' work/tango-original.apk | tee results/apk-size.txt
          unzip -tq work/tango-original.apk > results/apk-integrity.log

      - name: Download JADX CLI
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, urllib.request
          req = urllib.request.Request(
              "https://api.github.com/repos/skylot/jadx/releases/latest",
              headers={"User-Agent": "NexusAPK-Patcher"}
          )
          with urllib.request.urlopen(req, timeout=30) as r:
              release = json.load(r)
          assets = [
              a["browser_download_url"] for a in release.get("assets", [])
              if a["name"].startswith("jadx-")
              and not a["name"].startswith("jadx-gui-")
              and a["name"].endswith(".zip")
          ]
          if not assets:
              raise SystemExit("No JADX CLI ZIP found")
          print("JADX release:", release["tag_name"])
          with open("work/jadx-url.txt", "w") as f:
              f.write(assets[0])
          PY
          curl -fL --retry 3 "$(cat work/jadx-url.txt)" -o work/jadx.zip
          unzip -q work/jadx.zip -d work/jadx
          JADX_BIN="$(find work/jadx -type f -name jadx -print -quit)"
          test -n "$JADX_BIN"
          chmod +x "$JADX_BIN"
          "$JADX_BIN" --version
          echo "JADX_BIN=$JADX_BIN" >> "$GITHUB_ENV"

      - name: Decompile APK
        continue-on-error: true
        run: |
          set +e
          "$JADX_BIN" --threads-count 2 --show-bad-code \
            -d work/jadx-out work/tango-original.apk \
            > results/jadx.log 2>&1
          STATUS=$?
          set -e
          echo "$STATUS" > results/jadx-exit-code.txt
          echo "JADX exit code: $STATUS"
          find work/jadx-out -type f -name '*.java' | wc -l | tee results/java-file-count.txt

      - name: Trace model usages and feature call sites
        if: always()
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path("work/jadx-out")
          out = Path("results/reference-trace.txt")
          # Search full decompilation, not only files with matching names.
          groups = {
              "Balance response model references": re.compile(
                  r"UserBalanceResponse|GiftBalanceResponse|"
                  r"PromotionCoinsClaimResponse|SavingsBalanceResponseProto"
              ),
              "Balance and coin logic": re.compile(
                  r"userBalance|giftBalance|coinback|coinsBalance|"
                  r"insufficient.?balance|claimCoinback|"
                  r"PromotionCoinsAccessibilityResponse", re.I
              ),
              "Country picker and filtering": re.compile(
                  r"LiveCountryChooserActivity|LiveCountryPickerFragment|"
                  r"NearbyCountries|country.?code|country.?filter|"
                  r"selectedCountries|initialCheckedList", re.I
              ),
              "LIVE viewer and discovery": re.compile(
                  r"LiveViewerActivity|LiveViewerFragment|"
                  r"LivePagingConfig|live.?viewer|live.?broadcast|"
                  r"stream.?discovery|broadcast.?list", re.I
              ),
              "Chat repositories and navigation": re.compile(
                  r"ChatActivity|ChatRequestInboxActivity|"
                  r"conversationId|deleteAllChatRequest|"
                  r"observeChat|syncFoldersForChat", re.I
              ),
              "Network declarations and request execution": re.compile(
                  r"@GET|@POST|@PUT|@PATCH|@DELETE|"
                  r"Retrofit|Request\.Builder|HttpUrl|"
                  r"baseUrl|endpoint|GraphQL|grpc|"
                  r"OkHttpClient|newCall\(", re.I
              ),
              "Potential endpoint strings": re.compile(
                  r"""["']/(?:v[0-9]+/)?[A-Za-z0-9_./{}-]{2,}["']"""
              ),
          }

          MAX_PER_GROUP = 180
          MAX_LINE = 500
          with out.open("w", encoding="utf-8") as report:
              report.write("TANGO REFERENCE TRACE\n")
              report.write("Searches are static leads, not proof of live server behavior.\n")
              report.write("APK SHA-256:\n")
              sha = Path("results/apk-sha256.txt")
              if sha.exists():
                  report.write(sha.read_text(errors="replace") + "\n")

              for label, pattern in groups.items():
                  report.write("\n\n" + "=" * 76 + "\n")
                  report.write(label + "\n")
                  report.write("=" * 76 + "\n")
                  count = 0
                  files_with_hits = 0
                  if not root.exists():
                      report.write("JADX output directory is missing.\n")
                      continue
                  for path in root.rglob("*"):
                      if not path.is_file() or path.suffix not in {".java", ".kt", ".xml", ".json", ".txt"}:
                          continue
                      try:
                          if path.stat().st_size > 3_000_000:
                              continue
                          lines = path.read_text(encoding="utf-8", errors="replace").splitlines()
                      except OSError:
                          continue
                      local = []
                      for i, line in enumerate(lines):
                          if pattern.search(line):
                              local.append((i, line))
                      if not local:
                          continue
                      files_with_hits += 1
                      for i, line in local:
                          if count >= MAX_PER_GROUP:
                              break
                          report.write(f"\nFILE: {path}\nLINE: {i+1}\n")
                          start, end = max(0, i-4), min(len(lines), i+5)
                          for j in range(start, end):
                              marker = ">>" if j == i else "  "
                              report.write(f"{marker} {j+1}: {lines[j][:MAX_LINE]}\n")
                          count += 1
                      if count >= MAX_PER_GROUP:
                          break
                  report.write(f"\nReported matches: {count}; files with hits scanned: {files_with_hits}\n")
                  if count >= MAX_PER_GROUP:
                      report.write("Output capped for package size. Increase MAX_PER_GROUP if needed.\n")

          # Copy exact feature files plus report and logs for compact review.
          print("Created", out, "bytes:", out.stat().st_size)
          PY

      - name: Build compact package
        if: always()
        run: |
          set -euo pipefail
          mkdir -p package/relevant-source
          cp results/* package/ 2>/dev/null || true

          # Copy the main feature/model classes when available.
          find work/jadx-out -type f \
            \( -name '*UserBalanceResponse*' \
            -o -name '*GiftBalanceResponse*' \
            -o -name '*PromotionCoinsClaimResponse*' \
            -o -name '*LiveCountryChooserActivity*' \
            -o -name '*LiveCountryPickerFragment*' \
            -o -name '*LiveViewerActivity*' \
            -o -name '*LiveViewerFragment*' \
            -o -name '*ChatActivity*' \
            -o -name '*ChatRequestInbox*' \) \
            -size -2M \
            -exec cp --parents {} package/relevant-source/ \; \
            2>/dev/null || true

          {
            echo "Completed UTC: $(date -u +%FT%TZ)"
            echo "JADX exit code: $(cat results/jadx-exit-code.txt 2>/dev/null || echo unavailable)"
            echo "Java files: $(cat results/java-file-count.txt 2>/dev/null || echo 0)"
            echo "APK SHA-256: $(awk '{print $1}' results/apk-sha256.txt 2>/dev/null || true)"
          } > package/run-summary.txt

          find package -type f -name '*.log' -size +5M -exec truncate -s 5M {} \;
          du -sh package
          find package -type f | head -250

      - name: Upload trace package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Tango-reference-trace
          path: package/
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
